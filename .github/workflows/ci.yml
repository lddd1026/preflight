name: ci

# 每次 push / PR 都跑。这是纪律 D1 的自动化版本：
# 阶段测试可能忘记跑，CI 不会。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 开发机是 Windows（本地路径 / 换行符 / 编码的坑都在那里），
        # 但 CI 跑 Linux 才能证明代码本身不依赖平台。
        # 两个都跑：只要有一个绿，就不能说是"环境问题"。
        os: [ubuntu-latest, windows-latest]
        # ⚠️ **三个版本都要跑，因为 `pyproject.toml` 的 classifiers 里
        # 声明了三个。**
        #
        # 最初的写法是只跑首尾两个（3.11 + 3.13）—— 那是常见的省成本做法，
        # 而它有一个具体的后果：**3.12 被声明支持，却从没被测试过。**
        # 一条读 classifiers 的测试立刻抓到了这个不一致。
        #
        # 两种修法都成立：要么别声明 3.12，要么测它。
        # 选后者 —— 3.12 是真实在用的版本，而"只在 3.12 上坏"这种事
        # 恰恰是最难在事后解释的。
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 代码风格
        run: python -m ruff check .

      - name: 格式检查
        run: python -m ruff format --check .

      - name: 测试
        run: python -m pytest

      - name: 类型检查
        run: python -m mypy src
