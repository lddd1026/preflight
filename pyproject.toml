[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preflight-check"
version = "0.0.1"
description = "上线前的自动评审：把自动检查、文档漂移和人工签核收拢成一次运行"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["release", "readiness", "preflight", "agent", "lint", "review"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

# 依赖克制：能不加就不加。
# 语料（YAML）用 pyyaml；数据模型用 pydantic；CLI 用 typer + rich。
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    # mypy 需要它才能检查 pyyaml 的用法。
    # 不加的话 mypy 报 "Library stubs not installed for yaml"，而正确的处理是
    # **装存根**，不是用 ignore 把它压掉 —— 压掉就等于放弃了类型检查。
    "types-PyYAML>=6.0,<7",
    # 构建后端。
    #
    # 为什么它在 dev 里：有一条测试**真的去构建一次 wheel** 并检查内容 ——
    # 因为项目曾经在 S0–S7 期间**根本构建不出 wheel**（`force-include`
    # 把 knowledge/ 打了两遍），而本地一直"能跑"（用的是可编辑安装）。
    #
    # 那条测试用 `--no-build-isolation`（快、不联网），代价就是
    # hatchling 得在环境里。
    "hatchling",
]

# 外部工具适配器（S2）**是可选的**。
#
# 为什么不放进主依赖：它们不是 preflight 跑起来的前提 ——
# 没装的时候对应的规则会明确报"跳过"，而不是崩。这正是适配器层的设计。
#
# 想让检查更全就装上：`pip install -e ".[dev,tools]"`
#
# ⚠️ gitleaks 是一个 Go 二进制，不在 PyPI 上 —— 要单独装：
#     https://github.com/gitleaks/gitleaks#installing
# 没装时 general/leaked-secret 会被跳过，而内置的 general/hardcoded-secret
# 仍然有效（它是零依赖的兜底）。
tools = [
    "pip-audit>=2.7,<3",
    "ruff>=0.6,<1",  # 静态缺陷那条也需要它；dev 里也有一份，装 tools 单独跑时要有
]

# 文档理解层（S4）也**是可选的**，而且理由更硬。
#
# preflight 的核心承诺是"确定性层零 LLM、零依赖"。把 litellm 变成必装依赖，
# 等于让只想跑确定性检查的人装一个几十兆的模型网关 —— 那和这个项目的定位矛盾。
#
# 没装时 `preflight run` / `list-rules` / `docs` 全都正常，
# 只有 `preflight claims` 会明确报"要装 [llm]"。
llm = [
    "litellm>=1.50,<2",
]

[project.scripts]
preflight = "preflight.cli:main"

[project.urls]
Repository = "https://github.com/lddd1026/preflight"

[tool.hatch.build.targets.wheel]
# `packages` 会把 `src/preflight/` 下的**所有文件**打进 wheel ——
# 包括 `knowledge/` 的 YAML 和 `demo/` 的演示素材，不需要按扩展名过滤。
#
# ⚠️ 这里曾经有一条 `force-include` 把 `knowledge/` 又打了一遍，
# 结果是 **wheel 根本构建不起来**：
#
#     ValueError: A second file is being added to the wheel archive
#     at the same path: `preflight/knowledge/claims/verification.yaml`
#
# 而它在本地**永远发现不了** —— 开发时用的是 `pip install -e .`（可编辑安装），
# 那根本不构建 wheel。是 S8 的 Docker 构建第一次把它逼出来的。
#
# 教训：**"本地能跑"和"装得上"是两件事。** 而后者只有真去构建一次才知道。
packages = ["src/preflight"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# 排除 markdown：docs/ 里的代码示例是给人看的，注释对齐是刻意的，
# 不希望被 ruff format 重排。
#
# ⚠️ 也排除 `src/preflight/demo/` —— 那是**数据不是源码**。
# 让 linter 去检查一份"故意写坏"的演示素材，得到的是"这份素材确实是坏的"，
# 而那正是它存在的理由。真正要守的是**它坏得符合预期**
# （由 tests/test_acceptance_s3.py 守着）。
extend-exclude = ["*.md", "src/preflight/demo"]

[tool.ruff.lint]
# ⚠️ 这里的 select **包括 S（bandit 安全规则）**，是因为一件事：
#
# 适配器给别人的项目跑的是 ``F,E9,B,S``。如果我们自己只跑 ``E,F,I,UP,B,SIM,RUF``，
# 就会出现一个很隐蔽的后果 —— **S 类的抑制注释被 RUF100 当成"没用"删掉**。
# 实测：``adapters/base.py`` 里 subprocess 那行的 ``# noqa: S603`` 就是这么没的，
# 然后 preflight 用 ruff 查自己时报出了 S603。
#
# 教训：**一个只看窄规则集的自动修复，会删掉只有宽规则集才需要的抑制。**
# 修法不是把 noqa 加回去（它还会被删），而是让自己跑和工具要求别人跑的一样严。
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

# RUF001/002/003 把中文全角标点判成"有歧义的 Unicode 字符"。
#
# 这三条对一个中文项目只有噪音：本项目的注释、文档字符串、报错信息**故意**
# 用全角 ——「：」「（）」「、」在中文里就是正确写法，改成半角反而难读。
#
# 实测：不忽略它们，`ruff check` 一次报 **397 个错误**，全部是标点。
# 而 397 条噪音的结果是——没人再看 ruff 的输出，真问题也就被埋了。
#
# S101（用了 assert）同样忽略：它在测试文件里完全正常，而这个项目的
# 测试文件比源码还长。（这也是适配器默认忽略它的原因 —— 详见
# detect/adapters/ruff_tool.py 的 DEFAULT_IGNORE。）
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
# 测试里**故意**写"坏"东西：假密钥、假密码、硬编码临时路径、
# 以及为了验证"工具不修改被检查对象"而起的子进程。
# 那些不是漏洞，是被测试的行为本身。
"tests/*" = ["S105", "S106", "S107", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

# ⚠️ `src/preflight/demo/` 是**演示素材，不是源码**。
#
# 两份 agent 故意写得一份坏一份好（那是它存在的理由），它们不构成一个包 ——
# 两边的 `tests/test_agent.py` 同名，mypy 会报 "Duplicate module named"。
#
# **必须用 `exclude` 而不是 override 里的 `ignore_errors`**：
# override 是在**发现完文件之后**才生效的，而"重复模块名"这个错误
# 恰恰发生在发现阶段 —— 那时 override 还没轮到。
# 这个区别花了一次失败才搞清楚。
exclude = "preflight[/\\\\]demo"

# litellm 是**可选依赖**（`[llm]` extra），typing 也不完整。
#
# 为什么用 override 而不是把它塞进 dev 依赖：那会让**每一个**贡献者
# 为了跑 `ruff check` 都要装一个几十兆的模型网关。而这里要的只是
# "让 mypy 知道这个 import 是有意为之"，`ignore_missing_imports` 正好。
[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # 真实调用外部工具的用例。它们会 skip（工具没装时），
    # 所以在 CI 里跑不跑无所谓；但本地装了工具的人应该知道
    # `pytest -m slow` 能单独跑这一批。
    "slow: 真实调用外部工具（gitleaks / pip-audit / ruff）的冒烟测试",
]
