# 声明 → 验证策略的映射表 —— **这是数据**（纪律 D4）
#
# ## 为什么"确定性优先"要写成数据
#
# PLAN 定的顺序是：**能跑确定性检查器的，就别问模型。**
# 而"这条声明对应哪个检查器"是一张对应表 —— 表就是数据，
# 换个项目、加一条规则都只改这里。
#
# ## 这张表只放**真的能查**的对应
#
# 加一条对应之前先问：**跑完之后我能不能给出一个确定的结论？**
# 答不上来的就不该加 —— 那只会把"查不了"伪装成"查过了"。

version: 1

# ----------------------------------------------------------------------
# 主题 → 已有的确定性规则。
#
# 一条 constraint / behavior 声明，如果主题命中了这里的某条规则，
# 就**直接跑那条规则**：
#
#   - 规则报出发现 → 声明**不成立**（文档和代码漂移了）
#   - 规则没报     → 声明成立（确定性检查器没找到反例）
#   - 没有对应规则 → ⚠️ 查不了，而且要说清"无法证明否定"
#
# ⚠️ 只放**语义真的对得上**的。宁可少放 —— 放错会让一条无关的规则
# 去"验证"一条声明，得出的结论比"查不了"更糟：它看起来像查过了。
#
# ⚠️⚠️ 关键词必须**具体到规则的主题**，不能只沾边。
# 实测踩过：「坏 key 时错误文本**不回显**密钥」因为含「密钥」被映射到
# `general/hardcoded-secret` —— 而那条规则查的是"代码里有硬编码密钥"，
# 两者毫无关系。那条规则在测试夹具上报了一条，于是这句话被报成**漂移**。
#
# 所以关键词一律用**短语**：`硬编码密钥` 而不是 `密钥`。
# ----------------------------------------------------------------------
rule_topics:
  - rule: agent/no-request-timeout
    keywords: ["timeout", "超时", "请求超时"]
  - rule: agent/no-output-limit
    keywords: ["max_tokens", "输出长度", "输出上限", "最大输出"]
  - rule: agent/no-context-guard
    keywords: ["上下文闸门", "上下文窗口", "context_limit"]
  - rule: agent/no-budget-breaker
    keywords: ["预算闸门", "成本上限", "熔断", "总预算"]
  - rule: agent/tool-output-unbounded
    keywords: ["工具返回", "截断", "长度预算"]
  - rule: agent/unvalidated-model-output
    keywords: ["结构化输出", "schema 校验", "JSON 校验"]
  - rule: agent/output-field-has-default
    keywords: ["必填字段", "required"]
  - rule: agent/no-evidence-check
    keywords: ["evidence 必须", "证据必须", "依据必须"]
  - rule: general/tests-hit-network
    keywords: ["测试不联网", "不联网", "离线可测"]
  # ⚠️ 用短语，不用「密钥」/「secret」这种泛词 —— 见上面的说明
  - rule: general/hardcoded-secret
    keywords: ["硬编码密钥", "密钥进了版本库", "提交了密钥", "leaked secret"]
  - rule: general/env-not-ignored
    keywords: [".env 没进 gitignore", "忽略 .env", ".env 被提交"]
  - rule: general/no-eval-fingerprint
    keywords: ["评测集指纹", "指纹校验", "snapshot --check"]
  - rule: general/unpinned-dependency-upper-bound
    keywords: ["依赖约束", "主版本上界", "上界 = 下一个主版本"]

# ----------------------------------------------------------------------
# 计数目标 → 怎么数。
#
# ⚠️ **只放能精确数出来的东西。**
#
# 反例：「跑全套测试 507 passed」里的 507 是**跑一次才知道的数**，
# 而"测试函数个数"是另一个数（参数化会放大）。拿后者去核前者
# 会得出一个**假的"漂移"** —— 那比"查不了"糟得多。
#
# 所以每条计数目标都要求声明里出现**明确的单位词**（"个测试"而不是"测试"），
# 否则不认。宁可漏，不可错。
# ----------------------------------------------------------------------
count_targets:
  - name: 测试函数
    # 声明里必须出现这些词之一，才认为它数的是"测试函数个数"
    keywords: ["个测试", "条测试", "个用例", "条用例"]
    globs: ["tests/**/*.py", "**/test_*.py", "**/*_test.py"]
    mode: test_functions
    # ⚠️ **不是精确口径。** 文档说"19 个测试"可能指的是**用例数**，
    # 而参数化会把一个函数变成好几个用例 —— 数出来 17 个函数
    # 完全可能对应 19 个用例。所以"对不上"只能说查不了。
    exact: false

  - name: Python 文件
    keywords: ["个 Python 文件", "个 py 文件", "个源文件"]
    globs: ["**/*.py"]
    mode: files
    exact: true

  - name: 文档
    keywords: ["份文档", "个文档"]
    globs: ["**/*.md"]
    mode: files
    exact: true

  - name: 工具
    keywords: ["个工具"]
    globs: ["**/tools/**/*.py", "**/tools.py"]
    mode: files
    # ⚠️ **不是精确口径。** `tools/` 目录下有 `__init__.py`、`_render.py`
    # 这类不是"工具"的文件 —— 数出来 7 而文档说 5 个工具，
    # 两边说的根本不是一回事。
    exact: false

# ----------------------------------------------------------------------
# 明确**不查**的主题 —— 列出来是为了让"查不了"有一个可读的理由，
# 而不是一句笼统的"没有手段"。
# ----------------------------------------------------------------------
unverifiable_topics:
  - keywords: ["只读", "不会写文件", "不碰环境变量"]
    why: 这是**否定性**断言（"没有任何地方写文件"）—— 要证明它得遍历全部代码路径，而"没找到反例"不等于"不存在反例"。**无法证明否定。**
  - keywords: ["准确率", "passed", "覆盖率", "耗时", "延迟"]
    why: 这类数字要**跑一次才知道**（测试通过数、覆盖率、实测延迟），静态读代码数不出来。
  - keywords: ["面试", "值得讲", "更优雅", "更好"]
    why: 这是评价，没有真假可言。
