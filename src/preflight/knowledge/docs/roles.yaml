# 文档分类规则 —— **这是数据，不是代码**（纪律 D4）
#
# 加一类文档、换一个项目的命名习惯，改这里就行，不用动 Python。
# 判据的顺序就是优先级：**从上往下，第一个命中的赢**。
#
# ⚠️ 顺序很关键。真实项目里最容易撞车的是这几组：
#   - RELEASE_REVIEW.md 同时像 REVIEW 和 DESIGN   → REVIEW 在前
#   - SECURITY.md 同时像 SECURITY 和 METADATA     → SECURITY 在前
#   - DEV.md 同时像 CONVENTION 和 METADATA        → CONVENTION 在前
# 所以规则表的顺序**不是审美问题，是正确性问题**。

version: 1

# 这些路径下的 markdown 不是项目文档（第三方 / 缓存 / 生成物）。
#
# 注：仓库扫描器（detect/repo.py）已经忽略了一批目录，这里是第二道 ——
# 因为文档发现可能被单独调用（`preflight docs`），也可能扫到
# 扫描器没想到的目录。两处都设，是因为漏一个的代价是**把别人的
# README 当成你的项目文档**，然后抽出一堆和你无关的声明。
exclude_paths:
  - ".venv/**"
  - "venv/**"
  - "node_modules/**"
  - "site-packages/**"
  - ".pytest_cache/**"
  - ".mypy_cache/**"
  - ".ruff_cache/**"
  - "**/.pytest_cache/**"
  - "**/node_modules/**"
  - "build/**"
  - "dist/**"
  - ".git/**"
  #
  # ⚠️ 这里**故意不排除** CHANGELOG / LICENSE 这类文件。
  #
  # 它们确实不该被抽（`expect: nothing`），但那是**下面的规则表**决定的，
  # 不是在这里悄悄扔掉。区别很实在：
  #
  # - 排除掉 → 报告里"没看到 CHANGELOG"和"CHANGELOG 被排除了"长得一样
  # - 留着并标 skipped → 用户能看见"我们看到了它，而且决定不抽"
  #
  # 这就是 S1 定下的那条原则：**「跳过」和「没跑」必须长得不一样。**
  # 顺带一提，这条是测试抓出来的 —— 我一开始两处都写了，
  # 于是 metadata 那条规则永远不会生效（排除先命中）。

rules:
  # ------------------------------------------------------------------
  # 1. 安全 —— 排在 metadata 前面，因为 SECURITY.md 两边都像
  # ------------------------------------------------------------------
  - role: security
    expect: commitments
    why: 安全文档里全是"必须/不得"，是最实的一类承诺
    path_patterns:
      - "SECURITY*"
      - "**/SECURITY*"
      - "*THREAT*"
      - "*SECURITY*"
      - "*PRIVACY*"

  # ------------------------------------------------------------------
  # 2. 评审 / 上线检查 —— 排在 design 前面（RELEASE_REVIEW 两边都像）
  # ------------------------------------------------------------------
  - role: review
    expect: commitments
    why: 评审文档记录"我们查过什么、结论是什么"，是可核对的事实
    path_patterns:
      - "*REVIEW*"
      - "*CHECKLIST*"
      - "*AUDIT*"
      - "*SIGNOFF*"
      - "*RELEASE*"
      # 过程记录也是"记录"类：它写的是"做过什么、结论是什么"。
      #
      # ⚠️ 这一条本来放在 plan 里（因为文件名带 PROGRESS 看着像计划），
      # 那是个错：`plan` 的 expect 是 `plans`，而过程记录里**大量是已达成的承诺**
      # （"五条验收全部达成"）。放错会系统性地把它们标成"未来计划"，
      # 于是一整类可验证的声明被跳过 —— 而且不会有任何报错。
      - "*PROGRESS*"
      - "*STATUS*"

  # ------------------------------------------------------------------
  # 3. 需求 —— 排在 design 前面（REQUIREMENTS 里也可能出现"设计"）
  # ------------------------------------------------------------------
  - role: requirements
    expect: commitments
    why: 需求文档是承诺最密集的地方（FR / NFR 编号本身就是断言）
    path_patterns:
      - "*REQUIREMENT*"
      - "*PRD*"
      - "*NFR*"
      - "**/SPEC.md"
      - "*SPECIFICATION*"

  # ------------------------------------------------------------------
  # 4. 运维 —— 回滚 / runbook / 部署
  # ------------------------------------------------------------------
  - role: operations
    expect: mixed
    why: 运维文档既写"怎么部署"（承诺）也写"以后要加"（计划）
    path_patterns:
      - "*RUNBOOK*"
      - "*ROLLBACK*"
      - "*OPERATION*"
      - "*OPS.md"
      - "*DEPLOY*"
      - "*INCIDENT*"
      - "*ONCALL*"
      - "*SRE*"

  # ------------------------------------------------------------------
  # 5. 设计 / 架构
  # ------------------------------------------------------------------
  - role: design
    expect: commitments
    why: 设计文档里的"模块划分""数据流"都是可以对照代码核对的断言
    path_patterns:
      - "*DESIGN*"
      - "*ARCHITECT*"
      - "*ARCH.md"
      - "*MODULE*"
      # 项目总览和概念说明也是设计类文档 —— 它们讲的是"这个系统是怎么组成的"
      - "*OVERVIEW*"
      - "*KNOWLEDGE*"
      - "*CONCEPT*"

  # ------------------------------------------------------------------
  # 6. 约定 / 开发指南 —— 排在 metadata 前面（DEV.md 两边都像）
  # ------------------------------------------------------------------
  - role: convention
    expect: commitments
    why: 约定文档写的是"必须遵守什么"，最容易和实际做法漂移
    path_patterns:
      - "CONTRIBUTING*"
      - "**/CONTRIBUTING*"
      - "*WORKFLOW*"
      - "*CONVENTION*"
      - "*STYLE*"
      - "*GUIDE*"
      - "DEV.md"
      - "**/DEV.md"
      - "*.github/*TEMPLATE*"
      - "**/*TEMPLATE*"
      - "CODE_OF_CONDUCT*"

  # ------------------------------------------------------------------
  # 7. 路线图 / 任务清单 —— **照抽**，但预期大多是未来计划
  #
  # 为什么这一条不跳过：跳过它，"计划没被当成承诺"就成了一句空话 ——
  # 因为你根本没看那些文档。照抽才能证明分类器真的在区分。
  # ------------------------------------------------------------------
  - role: plan
    expect: plans
    why: 路线图和任务清单以"将来会做"为主 —— 是"计划被当成承诺"的重灾区
    path_patterns:
      - "*ROADMAP*"
      - "*TODO*"
      - "*TASK*"
      - "*BACKLOG*"
      - "*MILESTONE*"
      - "*PLAN*"

  # ------------------------------------------------------------------
  # 8. 变更记录 / 许可证 —— 真的没有可验证的断言，跳过能省 token
  # ------------------------------------------------------------------
  - role: metadata
    expect: nothing
    why: 变更记录和许可证里没有"可验证的承诺"，抽它们只是浪费 token
    path_patterns:
      - "CHANGELOG*"
      - "LICENSE*"
      - "AUTHORS*"
      - "NOTICE*"
      - "CITATION*"
      - ".github/*.yml"
      - ".github/*.yaml"

  # ------------------------------------------------------------------
  # 9. 入口 —— README 放在最后，因为它是兜底性最强的一类：
  #    很多项目会叫 `docs/README-x.md`，那些也应当算入口。
  # ------------------------------------------------------------------
  - role: entry
    expect: mixed
    why: README 既有事实（怎么装、有哪些命令）也有愿景（将来要做什么）
    path_patterns:
      - "README*"
      - "**/README*"
      - "INDEX.md"
      - "**/INDEX.md"

# ----------------------------------------------------------------------
# 声明判定用的标记 —— **也是数据**（纪律 D4）
#
# 这一节和上面那节的分工：上面决定"这份文档是什么类型"，
# 这里决定"这一句话算不算承诺"。
#
# 为什么不把这些写进提示词：实测写进提示词的那几类**仍然会漏**，
# 而写在这里的每一条都能配一个正反例测试。**能用代码确定性判的事，
# 不该交给提示词反复叮嘱。**
# ----------------------------------------------------------------------
claim_markers:
  # 出现这些词 → 这句话定义的是一个**标准**，而不是现状。
  # 标准不是事实：它说的是"将来按什么判"，不是"现在是什么样"。
  # 所以强制标成 plan，**不管模型怎么说**。
  #
  # ⚠️ 但有个例外：同一句里出现 completion 里的词，说明它已经被验收了
  # （「验收通过 ✅」是事实，不是标准）。少了这个例外会把
  # 「M1 验收通过」这种真承诺也误标成计划。
  criterion: ["验收", "判定线", "关键路径", "判定标准"]

  # 出现这些 → 这件事**已经发生**，所以 criterion 里的词不再是"标准"
  completion: ["✅", "已完成", "已达成", "通过", "全绿", "✅"]

  # 出现这些词 → 说的是**将来**，强制标成 plan。
  # 只放多字词和明确的符号 —— 单个「会」「将」误伤太大
  # （「超限就停」是行为，不是计划）。
  future:
    - "尚未"
    - "还没"
    - "未实现"
    - "待办"
    - "待定"
    - "计划"
    - "预计"
    - "争取"
    - "下一步"
    - "后续"
    - "打算"
    - "以后"
    - "将会"
    - "将要"
    - "将来"
    - "⬜"
    - "TODO"

  # 引用以这些词开头（后面跟空格或反引号）→ 这是给**读者**的指令，
  # 不是对系统的断言，直接拒。
  #
  # ⚠️ 故意收得很紧：只放"后面几乎一定跟宾语"的动词。
  # 「看」「先」「配置」都没放 —— 「看起来」「先前的」「配置项」
  # 会被误伤，而那些是正常的断言。
  imperative_starts:
    - "读"
    - "用"
    - "把"
    - "对着"
    - "请"
    - "记得"
    - "不要"
    - "执行"
    - "安装"
    - "打开"

  # 引用以问号结尾 → 那是**提问**，没有真假可言。
  question_ending: ["？", "?"]

  # 出现这些 → 这句话**在断言什么**，所以即使它以冒号结尾、
  # 后面跟着代码块，也**不算**"引出示例的引导语"。
  #
  # ⚠️ 这一条是度量召回时补的。实测 46 条被拒的里**有 7 条是真承诺**，
  # 主因就是"引出示例"那条过滤器太宽：
  #
  #   ✗ 「在 `.env` 里配好 key，跑：」        ← 指令，该拒
  #   ✓ 「**它会**按需求 §6.1 的判分规则…：」  ← 有主语和谓语，是断言
  #   ✓ 「触发了**会**记 `stop_reason`…：」    ← 同上
  #   ✓ 「M7 的四个改进累积测量，**不是**…：」  ← 同上
  #
  # 判据就是"句子里有没有断言标记"。加了它，前三条留下、第一条照样拒。
  assertion_markers:
    - "是"
    - "会"
    - "有"
    - "能"
    - "必须"
    - "不得"
    - "都"
    - "已"
    - "可以"
    - "支持"
    - "包含"
#
# 只在**没被任何路径规则命中**时才用，而且命中了会标 `confident: false`。
#
# ⚠️ 两条约束，都是实测逼出来的：
#
# ① **必须至少命中 2 个不同的关键词**（见 discover.py 的 MIN_KEYWORD_HITS）。
#    只命中一个就下的结论，是"因为文档里出现了一次『回滚』，
#    所以它是一份运维文档" —— 而那次的真实情况是：那篇设计文档在讲
#    「回滚」这条**不变量**，和运维毫无关系。
#
# ② **关键词只放高精度短语，不放孤立的词**。
#    `runbook` 单独一个词看着很运维，但它在 preflight 自己的文档里是**规则名**
#    （`general/no-runbook`），于是"提到过 runbook"被读成了"这是运维文档"。
#    改成 `部署步骤` / `回滚步骤` 这类短语之后，它只在真的运维文档里出现。
#
# 这两条合起来的效果是：**认不出来就诚实地说 unknown，而不是猜一个。**
# ----------------------------------------------------------------------
content_fallbacks:
  - role: design
    why: 正文里反复出现架构 / 模块划分 / 数据流
    keywords: ["架构", "模块划分", "数据流", "架构图", "architecture", "component"]
  - role: requirements
    why: 正文里出现了功能需求 / 非功能需求编号
    keywords: ["功能需求", "非功能需求", "FR-", "NFR-", "验收标准"]
  - role: operations
    why: 正文里出现了部署 / 回滚的可执行步骤
    keywords: ["部署步骤", "回滚步骤", "值班", "故障处理", "上线流程", "on-call"]
  - role: convention
    why: 正文里出现了开发流程 / 提交规范
    keywords: ["开发流程", "提交规范", "代码风格", "分支策略"]
  - role: plan
    why: 正文里出现了里程碑 / 后续计划
    keywords: ["里程碑", "后续计划", "下一步", "roadmap", "todo"]
