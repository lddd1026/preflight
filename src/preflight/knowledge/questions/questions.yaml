# 人工必答的问题 —— **这是数据**（纪律 D4）
#
# ## ⚠️ 铁律：`required` 里**不能超过 5 条**
#
# PLAN 里那句警告是认真的：
#
# > 常见偷工减料：问卷问 60 条。
# > **必须实测「最小必答」的条数** —— 超过 5 条就要重新设计。
#
# 为什么是 5 条而不是 60 条：**问卷越长，答得越假。**
# 一个 60 条的问卷，用户会在第 10 条开始一路点"是"——
# 于是我们拿到 60 条噪声，还不如拿 5 条真话。
# 而且那 5 条会真的改变结论，60 条不会。
#
# ## 进这一节的三个条件（缺一不可）
#
# 1. **代码回答不了** —— 能从仓库看出来的不许问
# 2. **会改变结论** —— 不问"知道了也没用"的问题
# 3. **文档没答过** —— `from_docs` 里的词出现在声明里就跳过
#
# 第 2 条最难遵守。写问题时先问自己：这个答案会改哪一条结论？
# 答不上来的，删掉。

version: 1

required:
  - id: blast-radius
    text: 坏了会怎样？
    options:
      - 只是不好用，重试一次就行
      - 一个客户受影响
      - 全体用户受影响
      - 涉及资金或不可逆的数据
    why: 影响面决定了同一条问题该算多严重 —— 而代码看不出影响面
    effect: 调整所有发现的严重度，并决定门禁要多严
    from_docs: ["影响面", "blast radius", "影响范围"]

  - id: audience
    text: 这个系统面向谁？
    options:
      - 内部工具，使用者是自己人
      - 单个客户（私有部署）
      - 多个外部客户（SaaS）
    why: B 端比内部工具额外要审计、隔离、SLA、数据导出
    effect: 决定要不要查多租户隔离、审计日志、数据导出
    from_docs: ["面向", "SaaS", "私有部署", "多租户"]

  - id: multi-tenant
    text: 同一套部署服务多个互不信任的客户吗？
    options: ["不，每个客户独立部署", "是，同一套部署"]
    why: "**多租户最经典的越权是「一次忘写 where 就是全量数据」**，而这件事从代码里看不出来"
    effect: 如果「是」，关系数据库 / 缓存 / 搜索索引的「不越权」那几格必须查
    from_docs: ["多租户", "tenant", "租户隔离"]

  - id: sensitive-data
    text: 数据里有这些吗？（多选，用逗号分隔；没有就填「无」）
    options:
      - 手机号 / 身份证 / 地址（PII）
      - 支付信息
      - 健康信息
      - 无
    why: 数据类型触发合规检查，而字段名叫 `phone` 还是 `mobile` 不是判据
    effect: 决定「不泄漏」那几格要不要升级成 blocker
    from_docs: ["PII", "个人隐私", "手机号", "身份证", "支付信息"]

  - id: backup-drill
    text: 最近一次从备份恢复的演练是什么时候？
    options: ["半年内做过", "做过，但超过半年", "从来没做过", "我们不需要备份"]
    why: >-
      **没演练过的备份等于没有备份** —— 而"我们每天备份"这句话
      只有演练过才可信。这是唯一能验证那一格的方法
    effect: 决定「不能丢 × 关系数据库」那几格是 ✅ 还是 ❌
    from_docs: ["恢复演练", "演练记录", "restore drill"]

# ----------------------------------------------------------------------
# 按档案展开的问题 —— 用**条件**决定要不要问，而不是无条件问。
#
# 为什么不做成"档案里写死一批问题"：那会让每个 SaaS 项目都被问一遍
# 和它无关的东西。条件让问卷保持短。
# ----------------------------------------------------------------------
extra:
  - id: audit-log
    text: 有谁能接触到生产数据？这些访问有留痕吗？
    options: ["有完整审计日志", "只有部分操作有日志", "没有日志"]
    why: B 端客户会问这个问题，而它也是事后追责的唯一依据
    effect: 调整「不越权」相关发现的严重度
    applies_to_profiles: ["saas-enterprise"]
    from_docs: ["审计日志", "audit log", "访问日志"]

  - id: data-residency
    text: 客户数据会离开它所在的区域吗？
    options: ["不会", "会，但仅限明确的区域", "不确定"]
    why: 有些数据**按法规不能离开某个区域** —— 而复制是不区分这个的
    effect: 触发「多区域 × 不越权」那一格
    applies_to_profiles: ["saas-enterprise"]
    when_detected: ["multi-region"]
    from_docs: ["数据驻留", "data residency", "数据出境"]

  - id: pentest
    text: 做过外部渗透测试吗？
    options: ["一年内做过", "做过，超过一年", "没做过"]
    why: 企业采购几乎一定会问这个，而它不在自动检查的覆盖范围内
    effect: 作为报告里的一条人工签核项
    applies_to_profiles: ["saas-enterprise", "agent-enterprise"]

  - id: llm-data-training
    text: 发给模型的内容会被用来训练吗？
    options: ["合同里明确不用于训练", "不确定", "会用"]
    why: 这是 LLM 项目最常见的一条合规问题，而它取决于**合同**不是代码
    effect: 触发「LLM 调用 × 不泄漏」那一格
    applies_to_profiles: ["agent-enterprise", "saas-enterprise"]
    when_detected: ["llm-call"]
    from_docs: ["不用于训练", "数据训练", "training"]
