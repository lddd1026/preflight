id: general/leaked-secret
name: 扫描到泄漏的密钥（gitleaks）
severity: blocker
applies_to: both
audience: both
detect:
  kind: adapter
  checker: gitleaks
  params:
    timeout_s: 300
incident: |
  这是 `general/hardcoded-secret` 的**加强版**，两条不重复：

  ======================  ============================================
  内置 hardcoded-secret   正则，认得 sk- / AKIA / ghp_ 几种形态
  这条（gitleaks）         规则库 + 熵检测，**能扫 git 历史**
  ======================  ============================================

  为什么历史那一块关键：**密钥提交进仓库之后，删掉文件不影响历史里那一份。**
  任何人 clone 下来 `git log -p` 都能找到它。
  所以判断「泄没泄漏」不能只看当前工作区。

  两条都报同一个密钥时会重复。这是**故意接受**的：
  漏掉一个真密钥的代价，远大于报告里多一行。
report: |
  扫描到疑似密钥：{rule_id}{commit_hint}。
  → 密钥进了版本库就**必须轮换** —— 删文件不管用。
fix: |
  ① 去 provider 后台**轮换**这把密钥（这是唯一真正安全的动作）
  ② 清理 git 历史（`git filter-repo`）
  ③ 检查这把密钥能访问什么，确认没有被用过
refs:
  - RULES.md §2
stage: S2
