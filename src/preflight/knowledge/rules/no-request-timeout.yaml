id: agent/no-request-timeout
name: 模型调用没有超时
severity: high
applies_to: agent
audience: both
matrix:
  mechanism: llm-call
  invariant: no-overrun
detect:
  kind: ast
  # 具名 checker：同一个 ast kind 底下，"找吞异常"和"找缺 kwargs 的调用"
  # 是两套完全不同的查询，写不出通用的那个。
  #
  # 这个 checker 同时服务 no-output-limit —— 两者形状完全一样，
  # 差别只在要找哪个 kwarg。写两遍只会让两边慢慢分叉。
  checker: missing-call-kwarg
  params:
    require_kwarg:
      - timeout
    # 去哪找调用点。**真实项目几乎都会把模型调用包一层** ——
    # 那时候底下 SDK 那一次确实没传 timeout（参数在包装层传的），
    # 直接报它就是误报。设 wrapper_entry 就会**只查**这些入口。
    #
    # wrapper_entry:
    #   - myapp.llm.call_model
    symbols:
      - litellm.completion
      - litellm.acompletion
      - openai.chat.completions.create
      - anthropic.messages.create
      - google.genai.generate_content
incident: |
  litellm 的默认超时是 **600 秒/次**。乘以 ``max_steps=20``，
  最坏情况是 **3 小时**。

  provider 挂死（TCP 连上了但不回包）时，命令行会一直僵在那里，
  用户只能 Ctrl+C —— 而且看不出是"在等"还是"死了"。

  **这不是性能问题，是有界性问题**：一个没有超时的外部调用，
  等于把程序的终止权交给了对方。
report: |
  第 {line} 行的模型调用没有设置 timeout。
  → 默认 600 秒 × 你的最大步数，最坏情况下命令行会僵住几小时。
fix: |
  给调用加上 timeout=60，或统一在 client 构造时设一次。
  命令行工具建议 60 秒以内。
refs:
  - 需求 NFR-3
stage: S3
