id: agent/plain-text-ends-session
name: 「模型没调工具」被直接当成了结束
severity: medium
applies_to: agent
audience: both
detect:
  kind: ast
  checker: plain-text-ends-session
incident: |
  写成这样看着很自然，其实是错的：

  ```python
  if not reply.tool_calls:
      return reply.content      # ← 这里判死
  ```

  **模型经常先嘀咕一句「我先看看日志」** —— 那只是思考，不是结论。
  把它当成结束，这一次诊断就白跑了；更糟的是它会被记进准确率的分母，
  最后表现为「准确率莫名其妙地低」，而原因藏在循环的一个分支里。

  正确做法是**推它一把**：

  > 请继续调查。如果证据已经足够，必须调用 submit_diagnosis 提交结论 ——
  > 这是唯一能结束调查的方式。

  顺带一个细节：提示词在循环里的作用不是表达，是**控制流**。所以那句话
  要说清"唯一能结束的方式是什么"，而不是含糊的"请继续"。

  ⚠️ 误报场景：有些场景确实该结束（模型明确说了"我查不出来"）。
  所以这条是 medium，报的是**位置**不是结论。
report: |
  第 {line} 行把「模型没调工具」直接当成了结束。
  → 模型经常先说一句「我先看看日志」，那只是思考；判死等于这一次白跑。
fix: |
  改成推它一把：追加一条 user 消息，说明「要么用工具继续查，
  要么调用提交工具交结论 —— 那是唯一能结束调查的方式」。
refs:
  - RULES.md §4
stage: S3
