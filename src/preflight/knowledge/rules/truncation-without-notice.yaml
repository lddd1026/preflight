id: agent/truncation-without-notice
name: 截断了，但没告诉模型被截断
severity: medium
applies_to: agent
audience: both
matrix:
  mechanism: llm-call
  invariant: no-loss
detect:
  kind: ast
  checker: tool-output-budget
  params:
    aspect: truncation
incident: |
  **截断可以，但不能悄悄截断。**

  模型看到的内容只有两种理解方式：

  - 有元信息 → 「这是抽样，共 1024 条，我看到前 20 条」→ 它会**主动追问**
    或者意识到证据可能不完整
  - 没有元信息 → 「这就是全部」→ 它**基于一份残缺的数据推理**，
    而且完全不知道自己缺了什么

  第二种是这条规则要抓的。它的可怕之处在于**没有症状**：
  模型会给你一个逻辑通顺的结论，只是结论建立在"它以为日志只有 20 行"之上。

  实测形态：工具返回被砍到 2000 字符，头部什么都没说 ——
  于是模型在报告里写「该服务在故障窗口内只有 20 条错误日志」，
  而实际上是 20000 条。

  ⚠️ 这是个启发式判断：函数名里带 truncate / clip / render 的才算候选，
  而且只在**字符串字面量**里找件数元信息（变量名里出现 total 不算 ——
  那可能只是内部计数，模型看不到）。
report: |
  第 {line} 行的 {function}() 看起来在截断内容，但返回值里没有
  告诉调用方「被截断了多少」。
  → 模型会以为看到的是全部，然后基于一份残缺的数据推理，**而且没有症状**。
fix: |
  在返回内容的头部加一句元信息，例如
  「共命中 1024 条，以下是前 20 条（已按时间倒序）」。
  那句话的成本是几十个 token，换来的是模型知道自己缺了什么。
refs:
  - 需求 NFR-11
stage: S3
