id: long-connection
name: 长连接
why_it_breaks: 断线、重连风暴、连接与服务端状态不同步
probes:
  - kind: dependency
    any_of:
      - websockets
      - python-socketio
      - socket.io
      - channels
      - aiohttp-sse
    why: |
      长连接库。
      注意不要用 aiohttp / uvicorn 这种"也可能只是普通 HTTP"的宽泛线索 ——
      那会让每个 Web 项目都被判定为有长连接，等于没有探测。
  - kind: ast_symbol
    any_of:
      - WebSocket
      - WebSocketHandler
      - ConnectionManager
      - on_connect
      - on_disconnect
    why: 连接管理器的类名通常很稳定
  - kind: config_file
    any_of:
      - proxy_read_timeout
      - upgrade
    why: 反向代理的配置里出现超时/升级设置，说明前面挂着长连接

cells:
  - invariant: no-loss
    checks:
      - 重连补发机制 + 测试
    why: "\"**断线期间的消息去哪了** —— 这是长连接最常被忽略的一段"
  - invariant: no-duplicate
    checks:
      - 客户端按消息 ID 去重
    why: 补发 + 实时推送重叠时，同一条消息会到两次
  - invariant: ordering
    checks:
      - 顺序号分配 + 测试
    why: 重连之后的新连接和旧连接可能同时活着
  - invariant: no-unauthorized
    checks:
      - 连接建立时鉴权
    why: 鉴权只在建立时做一次，而连接可能活几小时 ——
      期间用户的权限可能已经被撤销了
  - invariant: no-overrun
    checks:
      - 连接数上限
      - 重连风暴退避
    why: "\"**重连风暴**：服务恢复的瞬间所有客户端同时重连， 把刚起来的服务再打挂一次"
