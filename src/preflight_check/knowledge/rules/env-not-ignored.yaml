id: general/env-not-ignored
name: .env 没有被 gitignore
severity: blocker
applies_to: both
audience: both
detect:
  kind: exists
  params:
    path: .gitignore
    # ⚠️ 这里必须**按行**匹配，不能用子串。
    #
    # 因为 `.gitignore` 里常见的一行是 `!.env.example` —— 它也包含
    # `.env` 这三个字符。用子串匹配的话，"只忽略了模板文件"会被判成合格，
    # 而那正是这条规则要抓的情况。（第一版就是这么写的，会误报。）
    must_match_lines:
      - '^\.env$' # 单独一行 .env —— 最常见
      - '^\.env\*$' # .env* —— 覆盖 .env 本身
      - '^\*\.env$' # *.env
      - '^/\.env$' # 根目录锚定
      - '^\*\*/\.env$' # **/.env
    must_not_match:
      # 显式把 .env 从忽略里排除回来 —— 比没写还糟
      - '^!\.env$'
incident: |
  这条没有任何争议，但仍然是最常见的事故来源之一。

  两个容易漏的细节：
  ① 只写了 `.env.example` 的忽略，没写 `.env` —— 看起来"处理过了"
  ② `.env` 曾经被提交过：后来加进 .gitignore **不会**把它从历史里移除。
     这时候正确的动作是 `git rm --cached .env` **加上轮换密钥** ——
     光删文件不管用，历史里还在。
report: |
  仓库里没有 .gitignore，或者 .gitignore 里没有 .env 规则。
  → 一次 `git add .` 就可能把密钥提交上去。
fix: |
  在 .gitignore 里加 `.env`（保留 `!.env.example`）。
  如果 .env 曾经被跟踪过：`git rm --cached .env`，然后**轮换密钥**。
refs:
  - RULES.md §2
stage: S1
