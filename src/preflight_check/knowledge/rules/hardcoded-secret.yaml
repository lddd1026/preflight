id: general/hardcoded-secret
name: 密钥被硬编码或写进版本库
severity: blocker
applies_to: both
audience: both
detect:
  kind: text
  params:
    # 三种最常见的形态：OpenAI / 通用 sk-　AWS AKIA　GitHub ghp_
    #
    # ⚠️ 为什么不额外写一条"带默认值的读取"（`os.environ.get("X", "sk-...")`）：
    # 试过，是**多余的**。正则在整行里搜，那个字面量里的 `sk-xxxxxxxx…`
    # 已经被第一个分支匹配了，不需要单独一条。
    #
    # 而它有害：那条分支不要求长度，于是会匹配到**文档里引用的占位符**
    # 本身（`sk-...`）。实测它把 docs/RULES.md 里这条规则的说明文字报成了
    # "发现密钥" —— linter 匹配到自己的文档，是这类工具最经典的假阳性。
    pattern: '(sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})'
    # 不写 in_globs：默认扫全部文本文件。密钥可能在任何地方 ——
    # 限定后缀是最常见的漏检原因。
incident: |
  密钥提交进仓库之后，即使删掉那个文件，**git 历史里仍然在** ——
  任何人 clone 下来都能 `git log -p` 找到它。

  所以处理方式不是"删掉再提交"，而是：清理历史（filter-repo）+ **轮换密钥**。
  轮换是唯一真正安全的动作，因为泄露一旦发生就没法撤回。
report: |
  第 {line} 行出现了疑似密钥（{rule_hint}）。
  只报前 4 位和长度，不打印完整内容。
fix: |
  移到环境变量；把 .env 加进 .gitignore；
  清理 git 历史（git filter-repo）；**然后去 provider 后台轮换这把密钥**。
refs:
  - RULES.md §2
stage: S1
