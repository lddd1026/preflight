id: general/static-defect
name: 静态缺陷或安全问题（ruff）
severity: medium
applies_to: both
audience: both
detect:
  kind: adapter
  checker: ruff
  params:
    # 只查缺陷，不查风格。默认规则集里的几十条 E501 会把真问题淹掉。
    select: F,E9,B,S
    timeout_s: 120
incident: |
  这一条查的是**会在运行时变成 bug 的代码**，不是代码风格：

  ``F``   未定义的名字（一执行就 NameError）、未使用的 import
  ``E9``  语法级错误
  ``B``   可变默认参数、`except` 里吞掉异常、循环变量闭包……
  ``S``   硬编码密码、`eval`、弱哈希

  为什么要显式 ``--select``：ruff 的默认规则集包含大量风格项。
  把它们混进"上线前检查"，唯一的效果是**让真正的问题被淹掉** ——
  一个 300 行的报告没人会读完。

  ⚠️ 用 ``--no-cache`` 跑：ruff 默认会在**被检查的目录**写下
  ``.ruff_cache/``，那等于检查工具改变了被检查的东西。
report: |
  {code}：{message}
fix: |
  按 ruff 的提示修。``S`` 类的要特别当心 —— 那些是安全问题，
  不是"代码不够优雅"。
refs:
  - RULES.md §2
stage: S2
