# 声明抽取的**人工基准** —— fivewhys 文档，逐条核对的结果
#
# ## 这份文件为什么存在
#
# PLAN 里 S4 的唯一交付物是**准确率**。而"这句话算不算一条承诺"没有
# 确定性算法 —— 只能由人判定。
#
# 所以流程是：**机器抽 → 落盘 → 人逐条标 → 再算数字**。
# 这份文件就是中间那一步的留痕：数字可疑时可以回来看"人到底怎么判的"。
#
# ## 怎么用
#
# `scripts/check_claims_accuracy.py <claims.json>` 会拿它来比对。
# 匹配键是 **文档路径 + 行号**（不是引用文本 —— 文本可能被宽松匹配）。
#
# ## 抽样方法（必须写清，否则数字没有意义）
#
# - **plan 类文档（ROADMAP / TASKS）全量**：那是"计划被当成承诺"的重灾区
# - 其余文档**每 4 条取 1 条**
# - 合计 114 条，占当时全部承诺（246 条）的 46%
#
# 为什么不全量：全量是 246 条，逐条核对的时间成本不成比例，
# 而分层抽样已经覆盖了最容易错的那一类。**这是抽样，不是全量 ——
# 报告数字时必须一起说出来。**

version: 1
target: fivewhys
sampled_from: 246
sample_size: 114
sampling: "plan 类文档全量 + 其余每 4 条取 1 条"

# ----------------------------------------------------------------------
# 判错的那些：文档:行号 → 错误类别
#
# 类别用的是 SYSTEM_PROMPT 里那张排除表 —— 这样"模型没遵守哪一条"
# 就是一个可以统计的东西，而不是一堆零散的抱怨。
# ----------------------------------------------------------------------
wrong:
  ".github/PULL_REQUEST_TEMPLATE.md:16":
